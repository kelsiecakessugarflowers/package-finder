name: Sync copy from Google Sheet
on:
  workflow_dispatch:        # Manual only: "Run workflow" in the Actions tab
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-copy.mjs
      - name: Commit if changed
        run: |
          git diff --quiet data.json && exit 0
          git config user.name "copy-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Sync copy from Google Sheet"
          git push
