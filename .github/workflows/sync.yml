name: Sync packages from Airtable
on:
  workflow_dispatch:        # Manual only: "Run workflow" in the Actions tab (works from the GitHub mobile app)
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/sync-packages.mjs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet data.json && exit 0
          git config user.name "packages-sync"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "Sync packages from Airtable"
          git push
