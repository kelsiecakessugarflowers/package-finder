<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Sugar Flower Packages | Sugar Flowers by Kelsie Cakes</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="brand.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--kc-text);font:15px/1.55 var(--kc-font-body)}
.logo{display:block;height:48px;width:auto;margin:4px auto 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:4px}
.card{background:var(--kc-card);border:1px solid var(--kc-line);display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:40/23;object-fit:contain;display:block;background:var(--kc-white);border-bottom:1px solid var(--kc-line)}   /* package art is 2000x1150 with the name on it: never crop */
.body{padding:16px;display:flex;flex-direction:column;flex:1}
h3{font-family:var(--kc-font-heading);font-weight:500;color:var(--kc-heading);font-size:22px;margin:0 0 4px}
.for{color:var(--kc-muted);font-size:14px;margin:0 0 10px}
ul{margin:0 0 12px;padding-left:18px}
li{margin:1px 0}
.price{margin-top:auto;font-family:var(--kc-font-heading);color:var(--kc-heading);font-size:19px}
.price small{font-family:var(--kc-font-body);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--kc-muted);margin-right:6px}
.ctas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 4px 4px}
.ctas a{padding:14px 22px;text-decoration:none;font-weight:600;letter-spacing:.04em;border:1px solid var(--kc-accent)}
.ctas .primary{background:var(--kc-accent);color:var(--kc-accent-text)}
.ctas .secondary{background:var(--kc-card);color:var(--kc-accent)}
.note{text-align:center;font-size:13px;color:var(--kc-muted);margin:10px 4px 0}
.dots{display:none;justify-content:center;gap:6px;margin:2px 0 4px}
.dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--kc-line);cursor:pointer}
.dots button.on{background:var(--kc-accent)}
/* Phones: one card at a time, swipe sideways (the next card peeks in), dots underneath */
@media (max-width:640px){
  .grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 7% 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .grid::-webkit-scrollbar{display:none}
  .card{scroll-snap-align:center}
  .body{padding:14px}
  h3{font-size:20px}
  .dots{display:flex}
  .ctas{flex-direction:column;align-items:stretch;margin:14px 12px 4px}
  .ctas a{text-align:center}
  .logo{height:40px;margin-bottom:10px}
}
</style>
</head>
<body>
<img class="logo" src="logo-alt.svg" alt="Sugar Flowers by Kelsie Cakes">
<div class="grid" id="grid" aria-live="polite"></div>
<div class="dots" id="dots" aria-hidden="true"></div>
<div class="ctas">
  <a class="primary" id="finder" target="_top" href="index.html"></a>
  <a class="secondary" id="inquire" target="_top" href="#"></a>
</div>
<p class="note" id="note"></p>
<script src="packages.js"></script>
</body>
</html>
