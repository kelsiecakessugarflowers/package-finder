<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price Estimator | Sugar Flowers by Kelsie Cakes</title>
<meta name="description" content="See which custom sugar flower package fits your cake and where pricing starts.">
<link rel="stylesheet" href="brand.css">
<style>
/* Layout and hierarchy follow the quote builder: sticky header and bar, banded card headings, everything on one page */
:root{--bg:var(--kc-bg);--card:var(--kc-card);--ink:var(--kc-plum);--text:var(--kc-text);--muted:var(--kc-muted);--line:var(--kc-line);--accent:var(--kc-accent);--soft:var(--kc-accent-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--kc-font-body);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header{display:flex;justify-content:center}
header .logo{height:58px;width:auto;display:block}
h1.title{font-weight:600;color:var(--ink);font-size:22px;line-height:1.25;margin:8px 2px 6px;text-align:center}
footer{text-align:center;padding:8px 16px 24px;color:var(--muted);font-size:12px}
footer img{width:220px;height:auto;display:block;margin:0 auto 10px}
footer a{color:var(--muted)}
input.bad,select.bad,textarea.bad,.check.bad{border-color:var(--kc-berry);background:#fff7f8}
.err{color:var(--kc-berry);font-size:13px;margin:8px 0 0}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--text);min-height:72px;height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2>.full{grid-column:1/-1}
.grid2 .field{display:flex;flex-direction:column;justify-content:flex-end}
.plabel{margin:10px 0 -4px;font-size:13px;color:var(--muted)}
.radios{display:flex;gap:18px;margin:6px 0}
.radios label{display:flex;gap:6px;align-items:center;margin:0;color:var(--text);font-size:15px}
.radios input{width:auto}
.check.sms{font-size:14px;margin-top:8px;border:none;padding:4px 0}
.grid2 .field{min-width:0}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:0}
.sum dt{color:var(--muted);font-size:13px;padding-top:2px}
.sum dd{margin:0}
.sum img{width:22px;aspect-ratio:2/3;object-fit:cover;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.back{border:none;background:none;color:var(--accent);font-weight:600;padding:0;margin-top:12px;text-decoration:underline}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:10px;margin-top:6px;color:var(--text);font-size:15px}
.check input{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto}
.allergen{font-size:14px;margin:4px 0 0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs span{position:relative}
.thumbs img{width:64px;height:64px;object-fit:cover;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;font-size:13px;line-height:1;background:var(--ink);color:var(--kc-white);border:none}
.thanks{text-align:center;padding:28px 16px}
.thanks h2{background:none;border:none;margin:0 0 10px;padding:0;text-transform:none;letter-spacing:0;font-weight:600;font-size:24px;display:block}
main{max-width:640px;margin:0 auto;padding:12px}
.intro{margin:4px 2px 14px;color:var(--muted);font-size:15px;text-align:center}
section{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:12px}
h2{font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:-14px -14px 12px;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
section>label:first-of-type{margin-top:0}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--text)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;display:block}
.stylebtn{width:100%;display:flex;align-items:center;gap:10px;padding:6px 10px;text-align:left;min-height:46px;font-size:16px}
.stylebtn img{width:30px;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--line)}
.stylebtn .chev{margin-left:auto;color:var(--muted)}
dialog{border:none;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--card)}
dialog::backdrop{background:rgba(26,24,25,.45)}
.dlghead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-bottom:1px solid var(--line);padding:10px 14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;color:var(--ink)}
.dlghead button{border:none;background:none;font-size:22px;line-height:1;padding:4px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}
.tile{padding:0;display:flex;flex-direction:column;text-align:left}
.tile img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.tile span{padding:8px 10px;font-size:15px}
.tile.on{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}
.tile .none{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);font-size:14px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:0;padding:10px 12px;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.pals{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;height:16px;outline:1px solid var(--line)}.sw i{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.tag.star{background:var(--accent);color:var(--kc-white)}
.tag.sel{background:var(--ink);color:var(--kc-white)}
.tag.info{background:var(--soft);color:var(--accent);border:1px solid var(--accent)}
.pkgname{font-size:22px;font-weight:600;color:var(--ink);margin:6px 0 0;line-height:1.15}
.price{font-size:18px;font-weight:700;margin:4px 0 2px;color:var(--ink)}
.inc{margin:8px 0 0;padding-left:20px;font-size:15px}
.inc li{margin:2px 0}
.sub{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.pkg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px;margin-bottom:6px;text-align:left}
.note{background:var(--soft);border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0 0;font-size:14px}
.note.shop{border-left-color:var(--kc-berry)}
.note a,.muted a{color:var(--accent);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:5}
.bar .big{font-size:20px;font-weight:700;flex:1;color:var(--ink);min-width:0}
.bar .big small{display:block;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a{background:var(--accent);color:var(--kc-white);text-decoration:none;font-weight:600;padding:12px 16px;white-space:nowrap}
[hidden]{display:none!important}
@media (min-width:700px){.bar{justify-content:center;gap:28px}.bar .big{flex:0 0 auto;text-align:right}}
.bar a[aria-disabled=true]{background:var(--line);color:var(--muted);pointer-events:none}
</style>
</head>
<body>
<header><img class="logo" src="logo-main.svg" alt="Sugar Flowers by Kelsie Cakes"></header>
<main>
 <div id="viewEstimate">
  <h1 class="title" id="t-title"></h1>
  <p class="intro" id="t-intro"></p>

  <section>
    <h2 id="t-cardCake"></h2>
    <label for="role" id="t-labelRole"></label>
    <select id="role"></select>
    <label for="date" id="t-labelDate"></label>
    <input type="date" id="date">
    <p class="err" id="dateErr" hidden></p>
    <label for="size" id="t-labelSize"></label>
    <select id="size"></select>
    <label for="styleBtn" id="t-labelStyle"></label>
    <button type="button" class="stylebtn" id="styleBtn" aria-haspopup="dialog"></button>
    <label for="budget" id="t-labelBudget"></label>
    <select id="budget"></select>
  </section>


  <section aria-live="polite">
    <h2 id="t-cardEstimate"></h2>
    <div id="estimate"></div>
  </section>
 </div>

 <div id="viewDetails" hidden>
  <section>
    <h2 id="t-cardSummary"></h2>
    <dl class="sum" id="summary"></dl>
    <button type="button" class="back" id="editAnswers"></button>
  </section>
  <section id="details">
    <h2 id="t-cardDetails"></h2>
    <p class="muted" id="t-detailsIntro" style="margin-top:0"></p>
    <div class="grid2">
      <div class="field"><label for="first" id="t-labelFirst"></label><input id="first" autocomplete="given-name"></div>
      <div class="field"><label for="last" id="t-labelLast"></label><input id="last" autocomplete="family-name"></div>
      <div class="field"><label for="email" id="t-labelEmail"></label><input id="email" type="email" autocomplete="email"></div>
      <div class="field"><label for="phone" id="t-labelPhone"></label><input id="phone" type="tel" autocomplete="tel"></div>
      <label class="check full sms"><input type="checkbox" id="smsConsent"><span id="t-smsConsent"></span></label>
      <div class="full grid2" id="proFields" hidden>
        <p class="sub full" id="t-proHeading"></p>
        <div class="field full"><label for="bizLink" id="t-labelBizLink"></label><input id="bizLink" placeholder="@yourbakery or yourbakery.com"></div>
        <p class="full plabel" id="t-labelBizLocation"></p>
        <div class="field"><label for="bizCity" id="t-labelBizCity"></label><input id="bizCity" autocomplete="address-level2"></div>
        <div class="field"><label for="bizState" id="t-labelBizState"></label><select id="bizState"></select></div>
        <div class="field full" id="resaleBox" hidden>
          <label id="t-labelResale"></label>
          <div class="radios"><label><input type="radio" name="resale" value="Yes"> <span id="t-resaleYes"></span></label><label><input type="radio" name="resale" value="No"> <span id="t-resaleNo"></span></label></div>
          <div id="resaleFileBox" hidden><label for="resaleFile" id="t-labelResaleFile"></label><input id="resaleFile" type="file" accept="image/*,application/pdf"></div>
        </div>
      </div>
      <div class="field"><label for="pronouns" id="t-labelPronouns"></label><input id="pronouns"></div>
      <div class="field"><label for="referral" id="t-labelReferral"></label><select id="referral"></select></div>
      <div class="field full"><label for="palette" id="t-labelPalette"></label><input id="palette"></div>
      <div class="field full"><label for="vision" id="t-labelVision"></label><textarea id="vision"></textarea></div>
      <div class="field full"><label for="photos" id="t-labelPhotos"></label>
        <input id="photos" type="file" accept="image/*" multiple><p class="muted" id="photosHint" style="margin:4px 0 0"></p><div class="thumbs" id="thumbs"></div></div>
    </div>
    <p class="sub" id="t-allergenHeading"></p>
    <p class="allergen" id="t-allergenText"></p>
    <label class="check" data-f="allergen"><input type="checkbox" id="allergen"><span id="t-allergenCheck"></span></label>
    <div id="turnstile" style="margin-top:12px"></div>
    <p class="err" id="formErr" hidden></p>
  </section>
 </div>
</main>
<footer id="footer"></footer>
<dialog id="styleDlg" aria-labelledby="styleDlgTitle">
  <div class="dlghead"><span id="styleDlgTitle"></span><button type="button" id="styleClose" aria-label="Close">×</button></div>
  <div class="tiles" id="tiles"></div>
</dialog>

<div class="bar">
  <div class="big" id="barPrice"></div>
  <a id="barCta" target="_top" href="#" aria-disabled="true"></a>
</div>

<script src="app.js"></script>
</body>
</html>
