<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price Estimator | Sugar Flowers by Kelsie Cakes</title>
<meta name="description" content="See which custom sugar flower package fits your cake and where pricing starts.">
<link rel="stylesheet" href="brand.css">
<style>
/* Layout and hierarchy follow the quote builder: sticky header and bar, banded card headings, everything on one page */
:root{--bg:var(--kc-bg);--card:var(--kc-card);--ink:var(--kc-plum);--text:var(--kc-text);--muted:var(--kc-muted);--line:var(--kc-line);--accent:var(--kc-accent);--soft:var(--kc-accent-soft)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--kc-font-body);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;line-height:1.2;margin:0;font-weight:700;color:var(--ink)}
header p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
main{max-width:640px;margin:0 auto;padding:12px}
.intro{margin:4px 2px 12px;color:var(--muted);font-size:15px}
section{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:12px}
h2{font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);margin:-14px -14px 12px;padding:12px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
section>label:first-of-type{margin-top:0}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--text)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;display:block}
.stylepick{display:flex;gap:10px;align-items:flex-start}
.stylepick>div{flex:1;min-width:0}
.stylepick img{width:76px;aspect-ratio:2/3;object-fit:cover;border:1px solid var(--line);margin-top:10px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:0;padding:10px 12px;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
.pals{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:flex;flex-direction:column;gap:4px;padding:6px;flex:1 1 calc(50% - 6px);font-size:13px;text-align:left}
.pal.on{border:2px solid var(--accent);background:var(--soft)}
.sw{display:flex;height:16px;outline:1px solid var(--line)}.sw i{flex:1}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px;vertical-align:2px;white-space:nowrap}
.tag.star{background:var(--accent);color:var(--kc-white)}
.tag.sel{background:var(--ink);color:var(--kc-white)}
.tag.info{background:var(--soft);color:var(--accent);border:1px solid var(--accent)}
.pkgname{font-family:var(--kc-font-heading);font-size:24px;font-weight:500;color:var(--ink);margin:6px 0 0;line-height:1.15}
.price{font-size:18px;font-weight:700;margin:4px 0 2px;color:var(--ink)}
.inc{margin:8px 0 0;padding-left:20px;font-size:15px}
.inc li{margin:2px 0}
.sub{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.pkg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px;margin-bottom:6px;text-align:left}
.note{background:var(--soft);border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0 0;font-size:14px}
.note.shop{border-left-color:var(--kc-berry)}
.note a,.muted a{color:var(--accent);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:5}
.bar .big{font-size:20px;font-weight:700;flex:1;color:var(--ink);min-width:0}
.bar .big small{display:block;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a{background:var(--accent);color:var(--kc-white);text-decoration:none;font-weight:600;padding:12px 16px;white-space:nowrap}
.bar a[aria-disabled=true]{background:var(--line);color:var(--muted);pointer-events:none}
</style>
</head>
<body>
<header><h1 id="t-title"></h1><p id="t-brand"></p></header>
<main>
  <p class="intro" id="t-intro"></p>

  <section>
    <h2 id="t-cardCake"></h2>
    <label for="role" id="t-labelRole"></label>
    <select id="role"></select>
    <label for="date" id="t-labelDate"></label>
    <input type="date" id="date">
    <label for="size" id="t-labelSize"></label>
    <select id="size"></select>
    <div class="stylepick">
      <div>
        <label for="style" id="t-labelStyle"></label>
        <select id="style"></select>
      </div>
      <img id="stylePhoto" alt="" hidden>
    </div>
    <label for="budget" id="t-labelBudget"></label>
    <select id="budget"></select>
  </section>

  <section>
    <h2 id="t-cardPalette"></h2>
    <p class="muted" id="t-paletteHint" style="margin-top:0"></p>
    <div class="pals" id="pals"></div>
  </section>

  <section aria-live="polite">
    <h2 id="t-cardEstimate"></h2>
    <div id="estimate"></div>
  </section>
</main>

<div class="bar">
  <div class="big" id="barPrice"></div>
  <a id="barCta" target="_top" href="#" aria-disabled="true"></a>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
// style: null = not chosen yet, '' = "Not sure yet"
const st = {role: '', date: '', size: '', style: null, budget: '', palette: '', pkg: ''};
let D, T;
// Copy lives in data.json "copy"; {placeholders} are filled here
const t = (k, vars = {}) => String(T[k] ?? '').replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');

// ---- Analytics: anonymous events only (no names, emails or dates) ----
// Opened directly: pushed to this page's GTM. Inside a Showit iframe: posted to the parent page,
// where the quiz's gtm-iframe-bridge.js forwards them to the site's GTM.
const framed = window !== window.parent;
function track(event, data = {}) {
  const payload = {event, tool: 'price_estimator', ...data};
  if (framed) { try { parent.postMessage({type: 'quiz_analytics', ...payload}, '*'); } catch (e) {} }
  else { (window.dataLayer = window.dataLayer || []).push(payload); }
}
function loadGtm(id) {
  if (framed || !id) return;
  window.dataLayer = window.dataLayer || []; window.dataLayer.push({'gtm.start': Date.now(), event: 'gtm.js'});
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtm.js?id=' + id; document.head.appendChild(s);
}

const role = () => D.roles.find(r => r.key === st.role);
const isPro = () => role()?.group === 'pro';
const tiersNum = () => st.size ? parseInt(st.size) : 0;   // "6+ tiers" -> 6
const priceFor = p => isPro() ? Math.round(p.price * (1 - D.proDiscount) / D.proRoundTo) * D.proRoundTo : p.price;
const fits = () => D.packages.filter(p => (p.tiers || []).includes(tiersNum())).sort((a, b) => a.price - b.price);
function suggested() {
  const f = fits(); if (!f.length) return null;
  const lean = st.style ? (D.styleLean[st.style] ?? 0.5) : 0;   // "Not sure yet" starts at the smallest fit
  return f[Math.round(lean * (f.length - 1))];
}
function daysUntil() {
  if (!st.date) return null;
  const [y, m, d] = st.date.split('-').map(Number), today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}
// Why this visitor goes to the shop instead ('date' or 'budget'), or '' for a custom inquiry
function shopReason() {
  const n = daysUntil();
  if (n !== null && n >= 0 && n < D.leadTime.shopUnderDays) return 'date';
  if (st.budget === D.shopBudget) return 'budget';
  return '';
}
function aim(txt, noun) {
  const s = String(txt || '');
  if (/dozens/i.test(s)) return 'Dozens of ' + noun;
  const m = s.match(/(\d+)\s*[-–]\s*(\d+)/), one = s.match(/(\d+)/);
  if (m) return +m[1] === 0 ? 'Up to ' + m[2] + ' ' + (+m[2] === 1 ? noun.replace(/s$/, '') : noun) : m[1] + '-' + m[2] + ' ' + noun;
  if (one) return (s.trim().startsWith('~') ? 'About ' : '') + one[1] + ' ' + noun;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderStatic() {
  document.querySelectorAll('[id^="t-"]').forEach(el => { el.textContent = t(el.id.slice(2)); });
  document.title = `${t('title')} | ${t('brand')}`;
  const opts = (list, val = x => x, lbl = x => x) => `<option value="">${esc(t('choose'))}</option>` + list.map(x => `<option value="${esc(val(x))}">${esc(lbl(x))}</option>`).join('');
  $('#role').innerHTML = opts(D.roles, r => r.key, r => r.label);
  $('#size').innerHTML = opts(D.tierOptions);
  $('#style').innerHTML = opts(D.styles) + `<option value="-">${esc(t('styleNotSure'))}</option>`;
  $('#budget').innerHTML = opts(D.budgets);
  $('#pals').innerHTML = D.palettes.map(p => `<button type="button" class="pal" data-pal="${esc(p.name)}" aria-pressed="false">
    <span class="sw">${p.colors.map(c => `<i style="background:${c[1]}" title="${esc(c[0])}"></i>`).join('')}</span>${esc(p.name)}</button>`).join('');
}

function inquiryUrl(p) {
  const u = new URL(D.filloutUrl), here = new URLSearchParams(location.search);
  ['utm_source', 'ck_subscriber_id', 'first_name', 'last_name', 'email', 'phone'].forEach(k => { if (here.get(k)) u.searchParams.set(k, here.get(k)); });
  const set = {client_type: role()?.clientType, event_date: st.date, tiers: st.size, style: st.style, palette: st.palette,
    budget: st.budget, package: p?.name, estimate: p ? priceFor(p) : '', source: 'estimator'};
  for (const [k, v] of Object.entries(set)) if (v !== '' && v != null) u.searchParams.set(k, v);
  return u.toString();
}

function render() {
  const ph = $('#stylePhoto');
  if (st.style) { ph.onerror = () => { ph.hidden = true; }; ph.src = `photos/${slug(st.style)}.jpg`; ph.alt = st.style + ' style example'; ph.hidden = false; } else ph.hidden = true;
  document.querySelectorAll('.pal').forEach(b => { const on = b.dataset.pal === st.palette; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });

  const el = $('#estimate'), cta = $('#barCta'), bar = $('#barPrice'), shop = shopReason(), n = daysUntil();
  const f = fits(), sug = st.size && st.style !== null ? suggested() : null, p = sug && (f.find(x => x.name === st.pkg) || sug);
  const notes = [];
  if (shop) notes.push(`<p class="note shop">${esc(t(shop === 'date' ? 'shopDate' : 'shopBudget'))}<br><a target="_top" href="${esc(D.shopUrl)}" data-cta="shop">${esc(t('barShop'))}</a></p>`);
  else if (n !== null && n >= 0 && n < D.leadTime.minimumWeeks * 7) notes.push(`<p class="note">${esc(t('noteShort', {minWeeks: D.leadTime.minimumWeeks}))}</p>`);
  else if (n !== null && n >= 0 && n < D.leadTime.rushWeeks * 7) notes.push(`<p class="note">${esc(t('noteRush', {rushWeeks: D.leadTime.rushWeeks}))}</p>`);

  if (!p) {
    el.innerHTML = `<p class="muted" style="margin:0">${esc(t('estimateEmpty'))}</p>` + notes.join('');
    bar.innerHTML = `<small>${esc(t('barEmpty'))}</small>`;
  } else {
    const size1 = st.size.replace(/s$/, '').replace(/^(\d) /, '$1-');   // "3 tiers" -> "3-tier", "6+ tiers" -> "6+ tier"
    const cake = `${size1} cake${st.style ? ' with a ' + ({Bundles: 'bundled'}[st.style] || st.style.toLowerCase()) + ' design' : ''}`;
    const others = f.filter(x => x !== p);
    el.innerHTML = `
      <span class="tag ${p === sug ? 'star' : 'sel'}">${esc(t(p === sug ? 'tagRecommended' : 'tagSelected'))}</span>${isPro() ? ` <span class="tag info">${esc(t('tagPro'))}</span>` : ''}
      <p class="pkgname">${esc(p.name)}</p>
      <p class="muted" style="margin:2px 0 0">${esc(t('forYour', {cake}))}${st.palette ? ' · ' + esc(st.palette) : ''}</p>
      <p class="price">${esc(t('startingAt'))} ${money(priceFor(p))}</p>
      <ul class="inc">
        <li>${esc(aim(p.statement, t('unitStatement')))}</li>
        <li>${esc(aim(p.supporting, t('unitSupporting')))}</li>
        <li>${esc(aim(p.greenery, t('unitFiller')))}</li>
        <li>${esc(t('includeCustom'))}</li>
        <li>${esc(t('includeShipping'))}</li>
      </ul>
      ${others.length ? `<p class="sub">${esc(t('othersHeading', {size: size1}))}</p>` + others.map(o => `<button type="button" class="pkg" data-pkg="${esc(o.name)}"><span>${esc(o.name)}</span><span>${esc(t('startingAt'))} ${money(priceFor(o))}</span></button>`).join('') : ''}
      ${notes.join('')}
      <p class="note">${esc(t('noteRetainer'))}</p>
      <p class="muted">${esc(t('noteFinal'))}</p>
      ${shop ? `<p class="muted"><a target="_top" href="${esc(inquiryUrl(p))}" data-cta="inquiry_anyway">${esc(t('inquiryAnyway'))}</a></p>` : ''}`;
    bar.innerHTML = `<small>${esc(t('startingAt'))}</small>${money(priceFor(p))}<small>${esc(p.name)}${isPro() ? ' · ' + esc(t('tagPro')) : ''}</small>`;
  }
  if (!p && !shop) { cta.textContent = t('barCta'); cta.setAttribute('aria-disabled', 'true'); cta.href = '#'; delete cta.dataset.cta; return; }
  cta.removeAttribute('aria-disabled');
  if (shop) { cta.textContent = t('barShop'); cta.href = D.shopUrl; cta.dataset.cta = 'shop'; }
  else { cta.textContent = t('barCta'); cta.href = inquiryUrl(p); cta.dataset.cta = 'inquiry'; }
}

let lastResult = '';
function trackResult() {
  const name = $('.pkgname')?.textContent || '', key = [name, shopReason(), isPro()].join('|');
  if (!name || key === lastResult) return; lastResult = key;
  const pkg = D.packages.find(x => x.name === name);
  track('estimator_result', {package: name, price: pkg ? priceFor(pkg) : '', route: shopReason() || 'inquiry', pricing: isPro() ? 'pro' : 'standard'});
}

document.addEventListener('change', e => {
  const id = e.target.id; if (!['role', 'date', 'size', 'style', 'budget'].includes(id)) return;
  st[id] = id === 'style' ? (e.target.value === '-' ? '' : e.target.value || null) : e.target.value;
  if (id === 'size' || id === 'style') st.pkg = '';
  if (id !== 'date') track('estimator_change', {field: id, value: st[id] || (id === 'style' && st.style === '' ? 'not sure' : '')});
  render(); trackResult();
});
document.addEventListener('click', e => {
  const pal = e.target.closest('.pal'), pkg = e.target.closest('.pkg'), link = e.target.closest('[data-cta]');
  if (pal) { st.palette = st.palette === pal.dataset.pal ? '' : pal.dataset.pal; track('estimator_change', {field: 'palette', value: st.palette}); render(); }
  if (pkg) { st.pkg = pkg.dataset.pkg; track('estimator_change', {field: 'package', value: st.pkg}); render(); trackResult(); }
  if (link) track('estimator_cta', {action: link.dataset.cta});
});

fetch('data.json').then(r => r.json()).then(d => {
  D = d; T = d.copy; loadGtm(d.gtmId); renderStatic();
  // ?for=couple|family|baker|vendor preselects the role (links from emails, trade pages)
  const f = new URLSearchParams(location.search).get('for');
  if (D.roles.some(r => r.key === f)) { st.role = f; $('#role').value = f; }
  render(); track('estimator_view');
});
</script>
</body>
</html>
